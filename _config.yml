theme: minima
title: Doitforonoreason's homepage
description: Where I occasionally post thoughts

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/
  puzzles:
    output: true
    permalink: /puzzles/:name/

# Default layout for all pages
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
      type: "puzzles"
    values:
      layout: puzzle
